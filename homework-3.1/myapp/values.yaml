# Global settings
environment: prod
replicaCount:
  database: 3
  cache: 3
  frontend: 5
  backend: 10

# Database (PostgreSQL)
database:
  enabled: true
  image:
    repository: postgres
    tag: "15-alpine"
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "4Gi"
      cpu: "1000m"
    limits:
      memory: "4Gi"
      cpu: "1000m"
  persistence:
    enabled: true
    size: 10Gi
  service:
    type: ClusterIP
    port: 5432

# Cache (Redis)
cache:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "4Gi"
      cpu: "1000m"
    limits:
      memory: "4Gi"
      cpu: "1000m"
  persistence:
    enabled: true
    size: 5Gi
  service:
    type: ClusterIP
    port: 6379

# Frontend (nginx)
frontend:
  enabled: true
  image:
    repository: nginx
    tag: "alpine"
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "50Mi"
      cpu: "200m"
    limits:
      memory: "100Mi"
      cpu: "500m"
  service:
    type: LoadBalancer
    port: 80

# Backend (application)
backend:
  enabled: true
  image:
    repository: wbitt/network-multitool
    tag: "latest"
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "600Mi"
      cpu: "1000m"
    limits:
      memory: "800Mi"
      cpu: "1500m"
  service:
    type: ClusterIP
    port: 8080
  env:
    HTTP_PORT: "8080"
