apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-exchange
  labels:
    app: data-exchange
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-exchange
  template:
    metadata:
      labels:
        app: data-exchange
    spec:
      containers:
      - name: busybox
        image: busybox:latest
        command: ["/bin/sh"]
        args:
          - -c
          - |
            echo "Starting busybox container - writing data every 5 seconds"
            while true; do
              date >> /output/data.txt
              echo "Data written at $(date)" >> /output/data.txt
              sleep 5
            done
        volumeMounts:
        - name: shared-data
          mountPath: /output

      - name: multitool
        image: wbitt/network-multitool:latest
        command: ["/bin/sh"]
        args:
          - -c
          - |
            echo "Multitool container started - ready to read shared data"
            while true; do
              sleep 3600
            done
        volumeMounts:
        - name: shared-data
          mountPath: /input

      volumes:
      - name: shared-data
        emptyDir: {}
